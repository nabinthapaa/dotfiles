exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Tokyonight"
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'default'
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

exec-once = hyprctl setcursor  material_cursors 32
exec-once =  kdeconnectd

# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Dunst Notification Manager
exec-once = easyeffects --gapplication-service

# Restore wallpaper and launch waybar
exec-once = hyprpaper
exec-once = [workspace 1 silent] ghostty
exec-once = [workspace 2 silent] zen-browser-bin
exec-once = kanata -c /home/nabin/.config/kanata/config.kbd

# Load cliphist history
exec-once = wl-paste --watch cliphist store
exec-once = quickshell -p ~/dotfiles/.config/quickshell/

